# ===== hermes-dispatch 部署（B 方案：Hermes Desktop 多用户接入，测试环境 192.168.0.117）=====
#
# 与 A 方案（hermes-orchestrator，:8643）并存：独立端口 8644 / 网络 hermes-b-net /
# 数据卷 /data/DockerVolume/hermes-b。
#
# 首次部署前先预拉基线镜像并构建 overlay（见 README）：
#   docker pull docker.1ms.run/nousresearch/hermes-agent:latest
#   docker compose build agent-image
#
# 启动：  docker compose up -d --build
# 日志：  docker compose logs -f dispatch

name: hermes-b

services:
  dispatch:
    build: ./dispatch
    image: hermes-dispatch:0.1.0
    container_name: hermes-dispatch
    restart: unless-stopped
    ports:
      - "${HERMES_PORT:-8644}:8644"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HERMES_ADMIN_KEY: ${HERMES_ADMIN_KEY:?请在 .env 设置}
      HERMES_SECRET_KEY: ${HERMES_SECRET_KEY:?请在 .env 设置}
      HERMES_PUBLIC_URL: ${HERMES_PUBLIC_URL:-}
      HERMES_IMAGE: ${HERMES_IMAGE:-hermes-agent:desktop}
      HERMES_AGENT_PORT: ${HERMES_AGENT_PORT:-8642}
      HERMES_DASHBOARD_PORT: ${HERMES_DASHBOARD_PORT:-9119}
      HERMES_DASH_FWD_PORT: ${HERMES_DASH_FWD_PORT:-9120}
      HERMES_NETWORK: ${HERMES_NETWORK:-hermes-b-net}
      HERMES_CPU_LIMIT: ${HERMES_CPU_LIMIT:-2}
      HERMES_MEM_LIMIT: ${HERMES_MEM_LIMIT:-2g}
      HERMES_DATA_DIR: ${HERMES_DATA_DIR:-/data/DockerVolume/hermes-b}
      HERMES_DATA_HOST_DIR: ${HERMES_DATA_HOST_DIR:-/data/DockerVolume/hermes-b}
      HERMES_IDLE_TIMEOUT_MINUTES: ${HERMES_IDLE_TIMEOUT_MINUTES:-60}
      HERMES_START_TIMEOUT_SECONDS: ${HERMES_START_TIMEOUT_SECONDS:-240}
      HERMES_SWEEP_INTERVAL_SECONDS: ${HERMES_SWEEP_INTERVAL_SECONDS:-30}
      HERMES_PROXY_START_WAIT_SECONDS: ${HERMES_PROXY_START_WAIT_SECONDS:-90}
      HERMES_PROXY_TIMEOUT_SECONDS: ${HERMES_PROXY_TIMEOUT_SECONDS:-600}
      HERMES_WS_MAX_SIZE_MB: ${HERMES_WS_MAX_SIZE_MB:-128}
      HERMES_DEFAULT_USER: ${HERMES_DEFAULT_USER:-default}
      HERMES_AGENT_EXTRA_ENV: ${HERMES_AGENT_EXTRA_ENV:-\{\}}
      HERMES_PYPI_MIRROR: ${HERMES_PYPI_MIRROR:-https://pypi.tuna.tsinghua.edu.cn/simple}
      HERMES_MODEL_PROVIDER: ${HERMES_MODEL_PROVIDER:-openai-api}
      HERMES_MODEL_NAME: ${HERMES_MODEL_NAME:-}
      HERMES_MODEL_BASE_URL: ${HERMES_MODEL_BASE_URL:-}
      HERMES_MODEL_API_MODE: ${HERMES_MODEL_API_MODE:-}
      HERMES_MAX_FILE_MB: ${HERMES_MAX_FILE_MB:-50}
    volumes:
      # 管理 agent 兄弟容器
      - /var/run/docker.sock:/var/run/docker.sock
      # 单卷双视角：容器内外同路径，bind mount 源无需换算
      - ${HERMES_DATA_HOST_DIR:-/data/DockerVolume/hermes-b}:${HERMES_DATA_DIR:-/data/DockerVolume/hermes-b}
    networks:
      - hermes-b-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 一次性构建 overlay agent 镜像（dashboard-forwarder s6 服务）。
  # 只 build 不跑；基线镜像更新后重新 `docker compose build agent-image` +
  # `POST /api/agents/refresh` 生效。
  agent-image:
    build:
      context: ./agent-overlay
      args:
        BASE_IMAGE: ${HERMES_BASE_IMAGE:-docker.1ms.run/nousresearch/hermes-agent:latest}
    image: ${HERMES_IMAGE:-hermes-agent:desktop}
    entrypoint: ["true"]
    restart: "no"

networks:
  hermes-b-net:
    name: hermes-b-net
