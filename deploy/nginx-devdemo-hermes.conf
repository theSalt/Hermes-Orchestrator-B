# devdemo 站点（:8888 ssl）+ hermes-dispatch /hermes/ subpath —— 完整替换文件
#
# 安装（在 192.168.0.117 上；先移除旧的 80 端口独立站点，两处同名 map 会冲突）：
#   sudo rm -f /etc/nginx/sites-enabled/hermes
#   sudo cp /etc/nginx/sites-enabled/devdemo /etc/nginx/sites-enabled/devdemo.bak-hermes
#   sudo cp /data/workspace/hermes-orchestrator-b/deploy/nginx-devdemo-hermes.conf \
#           /etc/nginx/sites-enabled/devdemo
#   sudo nginx -t && sudo systemctl reload nginx
#
# 对应 dispatch 侧 .env：HERMES_PUBLIC_PATH=/hermes、
# HERMES_PUBLIC_URL=https://192.168.0.117:8888（已配）
#
# 访问形态：https://192.168.0.117:8888/hermes/u/<user_id>/?token=<token>
# （证书自签 CN=devdemo.devpod.cn，浏览器需信任/放行一次；Desktop 用 IP 形态）
#
# /hermes 块设计要点（详见 README「经 nginx subpath 访问」）：
#   - location /hermes/ + proxy_pass 带尾斜杠：nginx 剥掉 /hermes 前缀转发，
#     dispatch 侧路由不变；
#   - dispatch 依 HERMES_PUBLIC_PATH 自行修正 X-Forwarded-Prefix（上游 dashboard
#     用它重建 SPA 资源 URL）与会话 cookie Path，nginx 不改写响应内容；
#   - 长超时 + 不缓冲：desktop 主通道是长连 WS，聊天是流式响应。

# WS Upgrade 需按请求有无 Upgrade 头区分 Connection 值（http{} 层级）
map $http_upgrade $hermes_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
        listen 8888 ssl;
        listen [::]:8888 ssl;

        ssl_certificate      ssl/devdemo.devpod.cn.crt;
        ssl_certificate_key  ssl/devdemo.devpod.cn.key;

        server_name devdemo.devpod.cn;

       error_page 497 https://$host:8888$request_uri;


	location /jira {
		include /etc/nginx/proxy_params;
		proxy_pass http://127.0.0.1:8080/jira;
	}

	location /confluence {
		include /etc/nginx/proxy_params;
		proxy_pass http://127.0.0.1:8090;
	}


	location /confluence/vhub/ {
            proxy_pass http://127.0.0.1:3300;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # TUS/大文件上传相关
            proxy_request_buffering off;
            client_max_body_size 0;

            # Range 下载相关
            proxy_buffering off;
        }

	location /owu/ {
            proxy_pass http://127.0.0.1:26080;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 0;

            # CRITICAL: Disable all buffering for streaming
            gzip off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            tcp_nodelay on;
            add_header X-Accel-Buffering "no" always;
            add_header Cache-Control "no-store" always;

            # Extended timeouts for LLM completions
            proxy_connect_timeout 1800;
            proxy_send_timeout 1800;
            proxy_read_timeout 1800;


        }

	location /hermes/ {
            proxy_pass http://127.0.0.1:8644/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $hermes_connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 附件上传（desktop 走此链路）
            client_max_body_size 256m;

            # 长连 WS + 流式响应（聊天 SSE）
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

	# 公网映射下收口（此站点经 devdemo.devpod.cn:8888 端口映射对外）：dispatch 的
	# 无鉴权冒烟口（/v1/*，X-User-Id 头定用户）与管理 API（/api/*，admin key 变公网面）
	# 不应经公网可达。只放行 /hermes/u/<uid>/ 反代（token 鉴权）与 /hermes/health。
	# 运维/建用户走内网直连 http://192.168.0.117:8644。
	location /hermes/v1/ { return 403; }
	location /hermes/api/ { return 403; }

	# 无尾斜杠归一（/hermes → /hermes/），避免相对路径资源 404
	location = /hermes {
		return 301 /hermes/;
	}

}
